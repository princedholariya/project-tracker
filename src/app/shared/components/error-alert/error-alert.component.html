<div *ngIf="isPageLevel" class="page-error-state">
  <div class="error-icon-circle">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
  </div>
  <h3 class="error-title">{{ title || 'Unable to load data' }}</h3>
  <p class="error-description">
    {{ errorMessage || 'Something went wrong while fetching tasks from the server. Check your connection and try again.' }}
  </p>
  <div class="error-actions">
    <button *ngIf="canRetry" type="button" class="btn retry-outline-btn" (click)="retry.emit()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Retry
    </button>
    <a *ngIf="backUrl" [routerLink]="backUrl" class="btn btn-outline">
      Back to Projects
    </a>
  </div>
  <div *ngIf="debugEndpoint" class="error-debug-badge">
    {{ debugEndpoint }}
  </div>
</div>
<div *ngIf="!isPageLevel && errorMessage" class="inline-error-banner">
  <div class="banner-content">
    <div class="banner-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>
    <div class="banner-text">
      <strong>Error:</strong> {{ errorMessage }}
    </div>
  </div>
  <div class="banner-actions">
    <button *ngIf="canRetry" type="button" class="btn btn-sm btn-outline retry-btn" (click)="retry.emit()">
      Retry
    </button>
    <button type="button" class="close-btn" (click)="dismiss.emit()" aria-label="Dismiss error">✕</button>
  </div>
</div>
