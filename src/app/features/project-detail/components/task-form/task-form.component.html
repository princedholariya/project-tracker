<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">{{ taskToEdit ? 'Edit task' : 'Add new task' }}</h2>
      <button type="button" class="close-btn" (click)="cancel.emit()" aria-label="Close modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </button>
    </div>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="taskTitle">Task title</label>
        <input
          id="taskTitle"
          type="text"
          formControlName="todo"
          class="form-input"
          [class.input-error]="isTitleInvalid"
          placeholder="e.g. Update user documentation"
          autofocus
        />
        <div *ngIf="isTitleInvalid" class="error-feedback">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Title must be at least 3 characters</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="dueDate">Due date</label>
        <input
          id="dueDate"
          type="date"
          formControlName="dueDate"
          class="form-input"
          [class.input-error]="isDueDateInvalid"
        />
        <span class="field-hint" [class.hint-error]="isDueDateInvalid">
          {{ isDueDateInvalid ? 'Due date cannot be in the past' : 'Must not be in the past' }}
        </span>
      </div>
      <div class="form-group">
        <label class="form-label">Priority</label>
        <div class="segmented-control">
          <button
            type="button"
            *ngFor="let p of priorities"
            class="segment-btn"
            [class.active]="taskForm.get('priority')?.value === p"
            (click)="setPriority(p)">
            {{ p }}
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="cancel.emit()">
          Cancel
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="taskForm.invalid || isSubmitting">
          <svg *ngIf="!taskToEdit" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <svg *ngIf="taskToEdit" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          {{ isSubmitting ? 'Saving...' : (taskToEdit ? 'Save Changes' : 'Add Task') }}
        </button>
      </div>
    </form>
  </div>
</div>
