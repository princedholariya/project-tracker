<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">Create New Project</h2>
      <button type="button" class="close-btn" (click)="cancel.emit()" aria-label="Close modal">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </button>
    </div>
    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label class="form-label" for="projectName">Project Name</label>
        <input
          id="projectName"
          type="text"
          formControlName="name"
          class="form-input"
          [class.input-error]="isNameInvalid"
          placeholder="e.g. Project — Mobile App Redesign"
          autofocus
        />
        <div *ngIf="isNameInvalid" class="error-feedback">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>Project name must be at least 3 characters</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="initialTask">
          First Task <span class="optional-tag">(optional)</span>
        </label>
        <input
          id="initialTask"
          type="text"
          formControlName="initialTask"
          class="form-input"
          placeholder="e.g. Set up initial sprint backlog"
        />
        <span class="field-hint">Optionally add the first task to seed this project</span>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" (click)="cancel.emit()">
          Cancel
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="projectForm.invalid">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Create Project
        </button>
      </div>
    </form>
  </div>
</div>
